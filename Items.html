  <style>
    :root {
      --bg-dark: #0a0c10;
      --card-dark: #161b22;
      --border-dark: #30363d;
      --accent-blue: #58a6ff;
      --text-main: #f0f6fc;
      --text-dim: #8b949e;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      margin: 0;
    }

    nav {
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-dark);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo { font-weight: 900; color: var(--accent-blue); text-decoration: none; font-size: 1.5rem; }
    .nav-links a { color: var(--text-main); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }

    .container { max-width: 800px; margin: 20px auto; padding: 0 24px; text-align: center; }
    
    /* PROJECT LOGO STYLE */
    .project-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 20px;
      border: 3px solid var(--accent-blue);
    }

    h1 { margin-bottom: 30px; font-weight: 800; text-align: left; }

    #itemsContainer {
      display: grid;
      grid-template-columns: 1fr;
      gap: 15px;
      text-align: left;
    }

    .item-card {
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 12px;
      padding: 20px;
      transition: transform 0.2s;
    }

    .item-card:hover { border-color: var(--accent-blue); }

    .item-title { color: var(--accent-blue); margin: 0 0 10px 0; font-size: 1.4rem; }
    .item-info { margin: 5px 0; font-size: 1rem; }
    .label { color: var(--text-dim); font-weight: 500; }
    .time-stamp { font-size: 0.85rem; color: var(--text-dim); margin-top: 15px; border-top: 1px solid #30363d; padding-top: 10px; }
  </style>
</head>

  <h1>My Reported Items</h1>

  <div id="itemsContainer">
    <div style="text-align:center; padding:50px; color:var(--text-dim);">
      <p>🔍 Scanning database for your reports...</p>
    </div>
  </div>
</div>

<script>
    const API_BASE = 'http://localhost:3000/api';

    async function loadMyItems() {
        const container = document.getElementById('itemsContainer');

        // ── 1. Auth check ──────────────────────────────────────────
        const userData = localStorage.getItem('uf_user');
        if (!userData) {
            window.location.href = 'Auth.html';
            return;
        }

        const user = JSON.parse(userData);
        // Handles both login response shapes: { id } and { user_id }
        const userId = user.id || user.user_id;

        if (!userId) {
            container.innerHTML = `<p style="color:#ff7b72;text-align:center;">
                ⚠️ Could not read your user ID. Please log out and log in again.</p>`;
            return;
        }

        // ── 2. Fetch from backend ──────────────────────────────────
        container.innerHTML = `<div style="text-align:center;padding:50px;color:var(--text-dim);">
            <p>🔍 Loading your items…</p></div>`;

        try {
            const token = localStorage.getItem('uf_token');
            const headers = token ? { 'Authorization': 'Bearer ' + token } : {};

            const response = await fetch(`${API_BASE}/items/user/${userId}`, { headers });

            // Give a clear error if the server is down or returns non-JSON
            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                throw new Error(errData.message || `HTTP ${response.status}`);
            }

            const items = await response.json();

            // ── 3. Empty state ─────────────────────────────────────
            if (!items || items.length === 0) {
                container.innerHTML = `
                    <div style="text-align:center;padding:60px;color:var(--text-dim);">
                        <div style="font-size:3rem;margin-bottom:16px;">📭</div>
                        <p style="font-size:1.1rem;font-weight:600;">No reports yet</p>
                        <p style="font-size:0.9rem;margin-top:8px;">
                            <a href="Report lost.html" style="color:var(--accent-blue);">Report a lost item</a> or
                            <a href="Report found.html" style="color:#00e5a0;margin-left:4px;">report a found item</a>
                        </p>
                    </div>`;
                return;
            }

            // ── 4. Render cards ────────────────────────────────────
            container.innerHTML = items.map(item => {
                const dateRaw  = item.reported_at || item.created_at || new Date();
                const itemDate = new Date(dateRaw).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
                const itemTime = new Date(dateRaw).toLocaleTimeString([], { hour:'2-digit', minute:'2-digit' });

                const typeBadge  = item.type === 'lost'
                    ? `<span style="background:#ff6b6b22;color:#ff6b6b;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;">😟 LOST</span>`
                    : `<span style="background:#00e5a022;color:#00e5a0;padding:3px 10px;border-radius:20px;font-size:0.75rem;font-weight:700;">✅ FOUND</span>`;

                const statusColor = { active:'#58a6ff', matched:'#f0a500', resolved:'#00e5a0' }[item.status] || '#58a6ff';
                const statusBadge = `<span style="color:${statusColor};font-weight:700;font-size:0.8rem;">${(item.status || 'ACTIVE').toUpperCase()}</span>`;

                const imgHtml = item.image_url
                    ? `<img src="http://localhost:3000${item.image_url}" alt="${item.title}"
                           style="width:100%;height:160px;object-fit:cover;border-radius:8px;margin-bottom:14px;"
                           onerror="this.style.display='none'">`
                    : '';

                return `
                <div class="item-card">
                    ${imgHtml}
                    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
                        ${typeBadge}
                        ${statusBadge}
                    </div>
                    <h3 class="item-title">${escHtml(item.title) || 'Untitled Item'}</h3>
                    ${item.description ? `<p class="item-info" style="color:var(--text-dim);font-size:0.9rem;margin-bottom:10px;">${escHtml(item.description)}</p>` : ''}
                    <p class="item-info"><span class="label">📍 Location:</span> ${escHtml(item.location) || 'Not specified'}</p>
                    <p class="item-info"><span class="label">📂 Category:</span> ${escHtml(item.category) || 'General'}</p>
                    <div class="time-stamp">📅 Reported on ${itemDate} at ${itemTime}</div>
                </div>`;
            }).join('');

        } catch (error) {
            console.error("Fetch Error:", error);
            container.innerHTML = `
                <div style="color:#ff7b72;text-align:center;padding:40px;">
                    <div style="font-size:2.5rem;margin-bottom:12px;">⚠️</div>
                    <p><strong>Could not load items</strong></p>
                    <p style="font-size:0.85rem;margin-top:8px;color:var(--text-dim);">
                        Error: ${error.message}<br><br>
                        Make sure <code style="background:#0a0c10;padding:2px 6px;border-radius:4px;">node server.js</code> is running.
                    </p>
                </div>`;
        }
    }

    // XSS-safe escape helper
    function escHtml(str) {
        if (!str) return '';
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function logout() {
        localStorage.removeItem('uf_token');
        localStorage.removeItem('uf_user');
        window.location.href = 'Auth.html';
    }

    window.onload = loadMyItems;
</script>

</body>

</html>
