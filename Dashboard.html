<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — UniFind</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0c10;
            --card-dark: #161b22;
            --border-dark: #30363d;
            --accent-blue: #58a6ff;
            --text-main: #f0f6fc;
            --text-dim: #8b949e;
            --sidebar-width: 260px;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ── SIDEBAR ── */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--card-dark);
            border-right: 1px solid var(--border-dark);
            display: flex;
            flex-direction: column;
            padding: 24px;
        }

        .logo { 
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 900; 
            font-size: 1.8rem; 
            color: var(--accent-blue); 
            margin-bottom: 40px; 
            text-decoration: none;
        }

        .menu-group { flex: 1; }

        .menu-item {
            padding: 12px 16px;
            margin-bottom: 8px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 14px;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 1rem;
            border: 1px solid transparent;
        }

        .menu-item:hover {
            background: rgba(88, 166, 255, 0.05);
            color: var(--text-main);
        }

        .menu-item.active {
            background: rgba(88, 166, 255, 0.1);
            color: var(--accent-blue);
            border: 1px solid rgba(88, 166, 255, 0.2);
        }

        .emoji-icon { font-size: 1.2rem; }

        .divider {
            height: 1px;
            background: var(--border-dark);
            margin: 20px 0;
        }

        /* ── MAIN CONTENT ── */
        .main-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 40px; 
        }
        
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .welcome-text h1 { font-size: 2rem; margin: 0; font-weight: 900; }
        .welcome-text p { color: var(--text-dim); margin-top: 5px; }

        .user-profile {
            display: flex;
            align-items: center;
            gap: 15px;
        }
 
        .avatar {
            width: 45px;
            height: 45px;
            background: var(--accent-blue);
            color: var(--bg-dark);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
        }

        /* ── STATS CARDS ── */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .stat-card {
            background: var(--card-dark);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-dark);
            transition: transform 0.3s ease;
        }

        .stat-card:hover { transform: translateY(-5px); }
        .stat-card h3 { font-size: 0.85rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin: 0; }
        .stat-card .value { font-size: 2.2rem; font-weight: 900; margin: 10px 0; color: var(--accent-blue); }
    </style>
</head>
<body>

    <div class="sidebar">
        <a href="Dashboard.html" class="logo">
            <img src="https://cdn-icons-png.flaticon.com/512/622/622669.png" width="30" style="filter: invert(58%) sepia(93%) saturate(345%) hue-rotate(183deg) brightness(101%) contrast(101%);">
            UniFind
        </a>
        
        <div class="menu-group">
            <a href="Dashboard.html" class="menu-item active">
                <span class="emoji-icon">📊</span> Overview
            </a>
            <a href="Items.html" class="menu-item">
                <span class="emoji-icon">📋</span> My Items
            </a>
            <a href="Report lost.html" class="menu-item">
                <span class="emoji-icon">😟</span> Report Lost
            </a>
            <a href="Report found.html" class="menu-item">
                <span class="emoji-icon">✅</span> Report Found
            </a>
            
            <a href="Notifications.html" class="menu-item">
                <span class="emoji-icon">🔔</span> CCTV
            </a>
        </div>

        <div class="divider"></div>
        
        <div class="menu-item" onclick="logout()" style="color: #ff6b6b;">
            <span class="emoji-icon">🚪</span> Logout
        </div>
    </div>

    <div class="main-content">
        <div class="header">
            <div class="welcome-text">
                <h1 id="welcomeGreeting">Welcome back!</h1>
                <p>Campus lost & found status at a glance.</p>
            </div>
            <div class="user-profile">
                <div class="avatar" id="userInitial">U</div>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>My Active Reports</h3>
                <div class="value" id="count-reports">0</div>
            </div>
            <div class="stat-card">
                <h3>AI Smart Matches</h3>
                <div class="value" id="count-matches">0</div>
            </div>
            <div class="stat-card">
                <h3>Unread Alerts</h3>
                <div class="value" id="count-notifs">0</div>
            </div>
        </div>

        <div style="margin-top: 40px;">
            <h2>Recent Activity</h2>
            <div style="background: var(--card-dark); padding: 30px; border-radius: 16px; border: 1px solid var(--border-dark); text-align: center; color: var(--text-dim);">
                <i class="fa-solid fa-clock-rotate-left" style="font-size: 2rem; margin-bottom: 15px; display: block;"></i>
                No recent activity to show. Reported items will appear here.
            </div>
        </div>
    </div>

    <script>
        // 1. Load User Session
        const userData = JSON.parse(localStorage.getItem('uf_user'));

        if (!userData) {
            window.location.href = 'Auth.html';
        } else {
            // Update UI with real name
            const name = userData.full_name || "Student";
            document.getElementById('welcomeGreeting').textContent = `Welcome, ${name}!`;
            document.getElementById('userInitial').textContent = name.charAt(0).toUpperCase();
            
            // Initialize stats
            updateStats();
        }

        // 2. Fetch Real Data for Stats
        async function updateStats() {
            try {
                // Fetch user items from your itemRoutes.js
                const response = await fetch(`http://localhost:3000/api/items/user/${userData.user_id || userData.id}`);
                const items = await response.json();
                
                if (Array.isArray(items)) {
                    document.getElementById('count-reports').textContent = items.length;
                    
                    // Filter for items that the backend marked as 'matched'
                    const matchCount = items.filter(i => i.status === 'matched').length;
                    document.getElementById('count-matches').textContent = matchCount;
                    document.getElementById('count-notifs').textContent = matchCount; // Linked to matches
                }
            } catch (err) {
                console.log("No items found or server offline.");
            }
        }

        // 3. Logout Logic
        function logout() {
            localStorage.removeItem('uf_user');
            localStorage.removeItem('uf_token');
            window.location.href = 'Auth.html';
        }
    </script>
</body>
</html>
